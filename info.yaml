# Tiny Tapeout project information
project:
  title:        "AWEChip v1 - 8-bit ALU Core"
  author:       "ARARAT33"
  discord:      ""
  description:  "A compact programmable 8-bit arithmetic and logic processing core for the AWE hardware architecture."
  language:     "Verilog"
  clock_hz:     50000000

  # One tile keeps the first silicon revision conservative and easy to harden.
  tiles: "1x1"

  # Unique Tiny Tapeout top-level module name.
  top_module:  "tt_um_ararat33_awechip"

  source_files:
    - "project.v"

# Pinout for the AWEChip v1 instruction interface.
pinout:
  # Inputs: opcode in ui[3:0]; ui[7:4] reserved for future control/version bits.
  ui[0]: "OP0"
  ui[1]: "OP1"
  ui[2]: "OP2"
  ui[3]: "OP3"
  ui[4]: "CTRL0"
  ui[5]: "CTRL1"
  ui[6]: "CTRL2"
  ui[7]: "CTRL3"

  # Outputs: current 8-bit result / accumulator state.
  uo[0]: "RESULT0"
  uo[1]: "RESULT1"
  uo[2]: "RESULT2"
  uo[3]: "RESULT3"
  uo[4]: "RESULT4"
  uo[5]: "RESULT5"
  uo[6]: "RESULT6"
  uo[7]: "RESULT7"

  # Bidirectional pins are used as the 8-bit operand/data input path.
  uio[0]: "DATA0"
  uio[1]: "DATA1"
  uio[2]: "DATA2"
  uio[3]: "DATA3"
  uio[4]: "DATA4"
  uio[5]: "DATA5"
  uio[6]: "DATA6"
  uio[7]: "DATA7"

yaml_version: 6
